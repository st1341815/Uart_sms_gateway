services:
  # UART SMS Gateway - 多设备短信网关
  #
  # 关键点：
  #   - network_mode: host —— 应用自身就是 HTTP 服务（无 nginx 层），
  #     且 AK/SK 的 IP 白名单需要真实来源 IP（改 bridge 后容器只能看到 172.x 网关地址）。
  #   - 串口用 by-path 绑定，避免 ttyACM 编号漂移。
  #   - 挂载 /dev/serial 以便容器内解析 by-path 符号链接。
  #   - ⚠️ 不用 privileged:true —— devices + /dev/serial 挂载已经够了，
  #     特权模式会把宿主机内核能力整体交出去。
  sms-multi:
    image: 13uncle/uart_sms_gateway:latest
    container_name: sms-multi
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置只读挂载
      - ./config.yaml:/app/config.yaml:ro
      # 数据（SQLite 数据库）
      - ./data:/app/data
      # 日志目录（config.yaml 里 log.filename = ./logs/sms.log）
      - ./logs:/app/logs
      # by-path 符号链接需要 /dev/serial 才可解析
      - /dev/serial:/dev/serial:ro
    devices:
      # 与 config.yaml 的 Port 对应；使用 by-path 时这两行可保留作兜底
      - /dev/ttyACM2:/dev/ttyACM2
      - /dev/ttyACM5:/dev/ttyACM5
