database:
  enabled: true
  type: sqlite
  sqlite:
    # 可选的 DSN 调优（glebarez/sqlite 走 modernc，用 _pragma 语法）：
    #   path: "./data/app.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
    # 单进程 + 文件库下 WAL 能显著减少「写时读阻塞」，busy_timeout 避免偶发 SQLITE_BUSY。
    path: "./data/app.db"
  show_sql: false
log:
  level: info # debug,info,warning,error
  filename: ./logs/sms.log

server:
  addr: "0.0.0.0:8080"
  ip_extractor: "X-Real-IP"

App:
  JWT:
    # 可留空：首次启动会自动生成 32 字节随机密钥并写到 ./data/.jwt_secret（0600）复用。
    #
    # ⚠️ 该密钥同时用于派生 AK/SK 密文的加密密钥 —— 换一次，库里所有
    #    AccessKey 的 SecretEnc 就再也解不开（业务方必须逐个重置）。
    #    要自己指定就填 >=32 字符的随机串，并确保与 data 目录一起备份：
    #      openssl rand -base64 32
    Secret: ""
    ExpiresHours: 168 # 7天
  Users:
    # 使用 Bcrypt 加密。**仅首次启动的种子**：库里已有该用户后不再覆盖
    # （后台 /account 改密即时生效且重启不丢）。
    #   docker run --rm httpd:alpine htpasswd -nbBC 12 "" '你的密码' | tr -d ':\n'
    admin: "***REDACTED_HASH***"
  OIDC:
    Enabled: false
    Issuer: ""
    ClientID: ""
    ClientSecret: ""
    RedirectURL: "http://localhost:8080/oidc/callback"

  # 串口配置（多设备支持）
  #
  # ⚠️ Port 强烈建议使用 /dev/serial/by-path/... 而不是 /dev/ttyACM*：
  #    多个 AirM2M 模块的 ID_SERIAL 相同（by-id 不可用），
  #    ttyACM 编号会随插拔/枚举顺序变化，导致「哪张卡是哪张」错乱。
  #    查看实际映射：ls -l /dev/serial/by-path/
  #    容器内解析 by-path 需要挂载：volumes: - /dev/serial:/dev/serial:ro
  #
  # 更彻底的做法是写 udev 规则生成固定软链（换 PCI 槽也不漂移），
  # 见 docs/port-binding-by-path.md 的「用 udev 生成固定软链」一节。
  #
  # 下面只是示例（设备 ID 与名称按需改；真实号码请勿写入仓库）：
  Serial:
    Devices:
      - ID: "sms1"
        Name: "卡1"
        Port: "/dev/serial/by-path/pci-0000:07:1b.0-usb-0:2:1.6"
        Description: "示例：中国联通（真实号码勿入库）"
        Enabled: true
      - ID: "sms2"
        Name: "卡2"
        Port: "/dev/serial/by-path/pci-0000:07:1b.0-usb-0:3:1.6"
        Description: "示例：境外漫游卡"
        Enabled: true

    # 兼容旧配置（单设备模式，已废弃，仅保留解析兼容）
    # Port: "/dev/ttyACM0"
