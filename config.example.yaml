database:
  enabled: true
  type: sqlite
  sqlite:
    path: "./data/app.db"
  show_sql: false
log:
  level: info # debug,info,warning,error
  filename: ./logs/sms.log

server:
  addr: "0.0.0.0:8080"
  ip_extractor: "X-Real-IP"

App:
  JWT:
    # 随机生成一个 32 字节字符串（示例已脱敏）
    Secret: "***REDACTED***"
    ExpiresHours: 168 # 7天
  Users:
    # 使用 Bcrypt 加密（示例已脱敏）
    admin: "***REDACTED_HASH***"
  OIDC:
    Enabled: false
    Issuer: ""
    ClientID: ""
    ClientSecret: ""
    RedirectURL: "http://localhost:8080/oidc/callback"

  # 串口配置（多设备支持）
  #
  # ⚠️ Port 强烈建议使用 /dev/serial/by-path/... 而不是 /dev/ttyACM*：
  #    多个 AirM2M 模块的 ID_SERIAL 相同（by-id 不可用），
  #    ttyACM 编号会随插拔/枚举顺序变化，导致「哪张卡是哪张」错乱。
  #    查看实际映射：ls -l /dev/serial/by-path/
  #    容器内解析 by-path 需要挂载：volumes: - /dev/serial:/dev/serial:ro
  #
  # 本机（192.168.11.21）当前为 2 张卡，设备 ID 与线上 config.yaml 保持一致：
  #    sms1 = 中国联通 15105513113  → ttyACM2
  #    sms2 = O2 UK 漫游卡          → ttyACM5
  Serial:
    Devices:
      - ID: "sms1"
        Name: "联通3113"
        Port: "/dev/serial/by-path/pci-0000:07:1b.0-usb-0:2:1.6"
        Description: "中国联通 +8615105513113"
        Enabled: true
      - ID: "sms2"
        Name: "O2UK3728"
        Port: "/dev/serial/by-path/pci-0000:07:1b.0-usb-0:3:1.6"
        Description: "O2 UK 漫游"
        Enabled: true

    # 兼容旧配置（单设备模式，已废弃，仅保留解析兼容）
    # Port: "/dev/ttyACM0"
