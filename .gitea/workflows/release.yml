name: Release (Gitea)

# 本地 Gitea 的发版流水线。
#
# 触发：推送 v* tag
# 产出：
#   1) 容器镜像（仅 linux/amd64）→ Gitea 内置容器仓库
#      构建方式是普通 docker build + docker push，不走 buildx。
#      2026-11-03 连续 5 次失败后放弃 buildx：它在这套环境里额外引入
#      buildkit 容器 netns / network=host / insecure registry 三层网络语义，
#      而单平台构建完全用不上它的多平台能力（详见「构建并推送镜像」步骤注释）。
#      要恢复多平台，先解决那三层问题，再考虑搬回 buildx。
#   2) 二进制发布包（仅 linux/amd64）→ dist-release/*.tar.gz + SHA256SUMS
#      2026-11-03 按用户要求收窄到单一平台：部署目标就是 x86 服务器，
#      其余平台产物从来没人下载，却让每次发版多花 5 次交叉编译。
#      恢复多平台：把 scripts/build-release.sh 里注释掉的 build_one /
#      pack_tar / pack_zip 行放回来（函数本身是通用的）。
#   3) Gitea Release（tag）并挂上发布包
#
# ⚠️ 刻意不用 actions/checkout / setup-go / setup-node：
#   act_runner 是「作业容器 + 宿主 dockerd」模式（无 DinD），拉 GitHub 上的
#   action 要经过 Gitea 的 actions 代理，本机网络下反复 i/o timeout。
#   改为：裸 git 拉代码 + 直接用 golang / node 官方镜像跑步骤。


on:
  push:
    tags:
      - 'v*'

env:
  # act_runner 把 /var/run/docker.sock 挂进作业容器，所以 docker CLI 直接可用
  DOCKER_HOST: unix:///var/run/docker.sock
  GOPROXY: https://goproxy.cn,direct
  NPM_REGISTRY: https://registry.npmmirror.com
  # 仓库坐标（不依赖 gitea.* 上下文，避免 server_url 内网/外网不一致时出错）
  REPO_OWNER: st1341815
  REPO_NAME: uart_sms_gateway
  # 镜像仓库地址：127.0.0.1:3000。
  #
  # 为什么是它（2026-11-03 实测，别再改）：
  #   本机 daemon 的 insecure-registries = ["::1/128", "127.0.0.0/8"]，
  #   即 docker 只对 loopback 网段自动降级走 HTTP。Gitea registry 是明文
  #   HTTP，换任何非 loopback 地址（172.20.0.1 / 172.20.0.2 / 192.168.11.7）
  #   daemon 都会强制 https 握手，报：
  #     Get "https://172.20.0.1:3000/v2/": http: server gave HTTP response
  #     to HTTPS client     ← run 99 就是这么挂的
  #
  #   本机实测：docker login 127.0.0.1:3000 → Login Succeeded。
  #
  # 踩过的坑（都发生在这一个变量的来回改动上，记下来免得再犯）：
  #   run 94-96 用 127.0.0.1 时失败，报 connection refused。当时误判为
  #     "127.0.0.1 在 buildkit 里指向容器自己"，改成了 172.20.0.1。
  #     实际真因是 buildx/buildkit 那一层（已整体弃用，见「构建并推送镜像」）。
  #     换地址反而引入了 run 97（https/http 不匹配）和 run 99（同款）。
  #   ⚠️ 排查时务必先确认在「哪台机器」上验证：Gitea + act_runner 都在
  #     192.168.11.7（GMKfnos），不是 192.168.11.21（dockersver，那台只跑
  #     sms-multi）。曾在 .21 上测 127.0.0.1:3000 得到 connection refused 并
  #     据此误判——那台机器本来就没有 Gitea。
  IMAGE_REPO: 127.0.0.1:3000/st1341815/uart_sms_gateway
  IMAGE_HINT: 192.168.11.7:3000/st1341815/uart_sms_gateway
  # 镜像目标架构。默认只出 amd64：
  #   2026-11-03 实测，多架构（+linux/arm64）会让 arm64 阶段在 QEMU 下跑完
  #   整个 builder（go build + 前端），耗时是纯 amd64 的数倍；而当前部署目标
  #   （飞牛 NAS / x86 服务器）都是 amd64，arm64 用户还有二进制发布包可用。
  # 确实需要多架构时改成：linux/amd64,linux/arm64
  IMAGE_PLATFORMS: linux/amd64
  # GITEA_API 在「解析宿主地址」步骤里运行时探测后注入（见该步骤注释）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 环境检查
        run: |
          set -e
          echo "tag       = ${GITHUB_REF#refs/tags/}"
          echo "repo      = ${GITHUB_REPOSITORY}"
          echo "server    = ${GITHUB_SERVER_URL}"
          echo "image(push)   = ${IMAGE_REPO}"
          echo "image(pull)   = ${IMAGE_HINT}"
          echo "workspace = $PWD"
          docker version --format '  docker {{.Server.Version}}'
          # 不再打印 buildx 版本：流水线已改回普通 docker build（见「构建并推送镜像」步骤）。
          git --version
          node --version
          go version || echo "(作业容器无 go，构建都在 golang 容器里跑)"

      - name: 解析宿主地址
        run: |
          set -e
          # act_runner 给每个 job 新建专属桥网络（GITEA-ACTIONS-TASK-...-release-network），
          # 作业容器里 127.0.0.1 是它自己、域名 gitea 也不解析；
          # 但「本网络的网关」就是宿主 → 走网关 IP 的 3000 端口即可打宿主上的 Gitea。
          # 作业容器挂的是宿主 docker.sock，所以直接 inspect 自己就能拿到网关。
          GW=$(docker inspect "$(hostname)" \
                 --format '{{range .NetworkSettings.Networks}}{{.Gateway}} {{end}}' 2>/dev/null | awk '{print $1}')
          if [ -z "$GW" ] && [ -r /proc/net/route ]; then
            HEX=$(awk '$2=="00000000" && $3!="00000000" {print $3; exit}' /proc/net/route)
            if [ -n "$HEX" ]; then
              N=$((16#$HEX))
              GW="$((N & 255)).$(((N >> 8) & 255)).$(((N >> 16) & 255)).$(((N >> 24) & 255))"
            fi
          fi
          echo "宿主网关（GW） = ${GW:-<未取到>}"
          echo "作业容器 IP    = $(hostname -i 2>/dev/null || true)"
          BASE=""
          for cand in "http://${GW}:3000" "http://127.0.0.1:3000" "${GITHUB_SERVER_URL}" "http://gitea:3000"; do
            case "$cand" in http://:3000|"") continue;; esac
            if curl -fsS -m 5 -o /dev/null "${cand}/api/v1/version"; then
              BASE="$cand"; break
            fi
          done
          [ -n "$BASE" ] || { echo "::error::找不到可达的 Gitea 地址（网关 ${GW} / 127.0.0.1 / gitea 都不通）"; exit 1; }
          echo "Gitea 可达地址 = $BASE"
          echo "GITEA_BASE=$BASE" >> "$GITHUB_ENV"
          echo "GITEA_API=$BASE/api/v1" >> "$GITHUB_ENV"

          # 作业容器的工作目录是 docker 卷（不是宿主路径），所以
          # `docker run -v "$PWD":/src` 会把宿主的空目录挂进去。
          # 这里反查「本目录在宿主上的真实路径」，供嵌套容器 bind mount。
          docker inspect "$(hostname)" \
            --format '{{range .Mounts}}{{.Destination}}|{{.Source}}{{println}}{{end}}' > /tmp/mounts.txt 2>/dev/null || true
          HOSTPWD=""
          BEST=0
          while IFS='|' read -r DEST SRC; do
            [ -n "$DEST" ] || continue
            case "$PWD/" in
              "$DEST"/*)
                if [ "${#DEST}" -gt "$BEST" ]; then
                  HOSTPWD="${SRC}${PWD#"$DEST"}"
                  BEST=${#DEST}
                fi
                ;;
            esac
          done < /tmp/mounts.txt
          echo "宿主工作目录（HOSTPWD） = ${HOSTPWD:-<未取到>}"
          [ -n "$HOSTPWD" ] || { echo "::error::无法反查宿主工作目录（嵌套容器拿不到源码）"; exit 1; }
          echo "HOSTPWD=$HOSTPWD" >> "$GITHUB_ENV"

      - name: 检出代码（裸 git，不走 action）
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          git init -q .
          TOKEN="${{ secrets.RELEASE_TOKEN }}"
          # 仓库是公开的 → 匿名 fetch 就能拉；token 只是转私有后的兜底。
          ok=0
          LAST_ERR=""
          # GITEA_BASE 由「解析宿主地址」步骤探出（本网络网关 :3000），其余只是兜底。
          for base in "${GITEA_BASE}" "http://127.0.0.1:3000" "${GITHUB_SERVER_URL}" "http://gitea:3000"; do
            [ -n "$base" ] || continue
            url="${base}/${GITHUB_REPOSITORY}.git"
            if [ -n "$TOKEN" ]; then
              # token 只出现在变量与 base64 后的 auth 头里，不落盘、不回显
              if LAST_ERR=$(git -c "http.extraheader=AUTHORIZATION: basic $(printf '%s' "${REPO_OWNER}:${TOKEN}" | base64 -w0)" \
                   fetch --depth=1 "$url" "+refs/tags/${TAG}:refs/tags/release" 2>&1); then
                echo "带 token 检出成功（$base）"; ok=1; break
              fi
              echo "-- 带 token 失败（$base）：$(echo "$LAST_ERR" | tail -2 | tr '\n' ' ')"
            fi
            if LAST_ERR=$(git fetch --depth=1 "$url" "+refs/tags/${TAG}:refs/tags/release" 2>&1); then
              echo "匿名检出成功（$base）"; ok=1; break
            fi
            echo "-- 匿名失败（$base）：$(echo "$LAST_ERR" | tail -2 | tr '\n' ' ')"
          done
          [ "$ok" = 1 ] || { echo "::error::拉取 tag ${TAG} 失败（网络或权限）"; exit 1; }
          git checkout -q refs/tags/release
          echo "HEAD = $(git rev-parse --short HEAD)"
          ls

      - name: 版本号一致性
        run: python3 scripts/check_version.py

      - name: 构建前端（node 容器）
        run: |
          set -e
          docker run --rm -v "$HOSTPWD":/src -w /src/web \
            -e NPM_REGISTRY="$NPM_REGISTRY" \
            node:22-bookworm sh -c '
              set -e
              npm config set registry "$NPM_REGISTRY"
              npm ci --no-audit --no-fund
              npm run build
            '
          rm -rf web/embed_dir && cp -a web/dist web/embed_dir
          echo "前端产物："
          ls -l web/embed_dir/assets | head

      - name: 构建多平台二进制与发布包
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          docker run --rm -v "$HOSTPWD":/src -w /src \
            -e VERSION="$VERSION" -e GOPROXY="$GOPROXY" \
            golang:1.25 sh -c '
              set -e
              go mod download
              sh ./scripts/build-release.sh "$VERSION"
            '
          echo "----- 产物 -----"
          ls -lh dist-release/

      - name: 打包 Windows zip（构建镜像无 zip 时用 python3）
        run: |
          set -e
          need=0
          for d in dist-release/uart_sms_forwarder-*-windows-amd64; do
            [ -d "$d" ] || continue
            need=1
            python3 scripts/zip_dir.py "$d"
            rm -rf "$d"
          done
          if [ "$need" = 1 ]; then
            ( cd dist-release && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt )
            cat dist-release/SHA256SUMS.txt
          else
            echo "构建镜像已自带 zip 命令，无需补救"
          fi
          ls -lh dist-release/

      - name: 构建并推送镜像
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          TOKEN="${{ secrets.RELEASE_TOKEN }}"
          [ -n "$TOKEN" ] || { echo "::error::缺少仓库 secret RELEASE_TOKEN"; exit 1; }

          # ⚠️ 这里刻意用普通 docker build + docker push，不走 buildx。
          #
          # 失败史（2026-11-03，run 94 起连续 5 次失败）：
          #   run 94/95/96  failed to fetch oauth token: dial tcp 127.0.0.1:3000:
          #                 connect: connection refused
          #   run 97        Head "https://172.20.0.1:3000/v2/...":
          #                 http: server gave HTTP response to HTTPS client
          #   run 98        探活 30 次全未过，诊断报 no such object: buildx_buildkit_*
          #
          # 根因是 buildx 在这套环境里多引入了一整个独立网络栈：
          #   - docker-container driver 会另起 buildkit 容器，它的 netns 与
          #     作业容器不是一回事，127.0.0.1 语义随之改变；
          #   - 该容器还要靠 network=host + buildkitd.toml 单独声明 insecure
          #     registry，才能碰明文 HTTP 的 Gitea；
          #   - builder 注册信息存在作业容器内的 ~/.docker/buildx，job 一结束
          #     即销毁，于是每次都要重建 buildkit 容器（层缓存其实也没留住）。
          # 换句话说：多平台能力一点没用上，却背了三层额外的网络语义。
          #
          # 当前只需要 linux/amd64 单平台，普通 docker build 完全够用，
          # 而且它和后面 docker push 共用同一个 daemon 网络 ——
          # 地址怎么通，推的时候就是怎么通，不存在「探针通了 push 不通」。

          # 用 docker login 而不是手写 config.json：之前手写是为了把凭证塞给
          # buildkit；现在没有 buildkit 了，让 daemon 自己管凭证更直接。
          printf '%s' "$TOKEN" \
            | docker login "${IMAGE_REPO%%/*}" -u "$REPO_OWNER" --password-stdin

          docker build \
            -f Dockerfile.multi \
            --build-arg "GOPROXY=${GOPROXY}" \
            --build-arg "NPM_REGISTRY=${NPM_REGISTRY}" \
            --build-arg "WEB_PREBUILT=1" \
            -t "${IMAGE_REPO}:${VERSION}" \
            -t "${IMAGE_REPO}:latest" \
            .

          docker push "${IMAGE_REPO}:${VERSION}"
          docker push "${IMAGE_REPO}:latest"

          echo "镜像已推送：${IMAGE_REPO}:${VERSION}"
          docker image inspect "${IMAGE_REPO}:${VERSION}" \
            --format '镜像 {{.Id}} 架构 {{.Architecture}} 大小 {{.Size}}'

      - name: 创建 Release 并上传发布包
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          GITEA_TOKEN="${{ secrets.RELEASE_TOKEN }}" \
          GITEA_API="$GITEA_API" \
          GITEA_REPO="${REPO_OWNER}/${REPO_NAME}" \
          IMAGE_HINT="$IMAGE_HINT" \
            sh scripts/ci-make-release.sh "$VERSION" dist-release

      - name: 汇总
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          {
            echo "## 发布完成 ${VERSION}"
            echo ""
            echo "**镜像（${IMAGE_PLATFORMS}）**"
            echo '```'
            echo "docker pull ${IMAGE_HINT}:${VERSION}"
            echo '```'
            echo "**发布包**"
            ls -lh dist-release/ | sed 's/^/    /'
            echo ""
            echo "**Release** → ${GITEA_BASE}/${REPO_OWNER}/${REPO_NAME}/releases/tag/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
