name: Release (Gitea)

# 本地 Gitea 的发版流水线。
#
# 触发：推送 v* tag
# 产出：
#   1) 多架构镜像（linux/amd64 + linux/arm64）→ Gitea 内置容器仓库
#   2) 多平台二进制发布包 → dist-release/*.tar.gz / *.exe.zip + SHA256SUMS
#   3) Gitea Release（tag）并挂上发布包
#
# ⚠️ 刻意不用 actions/checkout / setup-go / setup-node：
#   act_runner 是「作业容器 + 宿主 dockerd」模式（无 DinD），拉 GitHub 上的
#   action 要经过 Gitea 的 actions 代理，本机网络下反复 i/o timeout。
#   改为：裸 git 拉代码 + 直接用 golang / node 官方镜像跑步骤。


on:
  push:
    tags:
      - 'v*'

env:
  # act_runner 把 /var/run/docker.sock 挂进作业容器，所以 docker CLI 直接可用
  DOCKER_HOST: unix:///var/run/docker.sock
  GOPROXY: https://goproxy.cn,direct
  NPM_REGISTRY: https://registry.npmmirror.com
  # 仓库坐标（不依赖 gitea.* 上下文，避免 server_url 内网/外网不一致时出错）
  REPO_OWNER: st1341815
  REPO_NAME: uart_sms_gateway
  # buildkit 容器是 network=host，只能解析宿主侧地址 → 用 127.0.0.1:3000 推送。
  # Gitea 内置 registry 的仓库路径与访问域名无关，所以推 127.0.0.1 与
  # 用户侧 192.168.11.7 指向同一个镜像仓库。
  IMAGE_REPO: 127.0.0.1:3000/st1341815/uart_sms_gateway
  IMAGE_HINT: 192.168.11.7:3000/st1341815/uart_sms_gateway
  # 作业容器是 host 网络 → 直接打宿主上的 gitea
  GITEA_API: http://127.0.0.1:3000/api/v1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 环境检查
        run: |
          set -e
          echo "tag       = ${GITHUB_REF#refs/tags/}"
          echo "repo      = ${GITHUB_REPOSITORY}"
          echo "server    = ${GITHUB_SERVER_URL}"
          echo "image(push)   = ${IMAGE_REPO}"
          echo "image(pull)   = ${IMAGE_HINT}"
          echo "workspace = $PWD"
          docker version --format '  docker {{.Server.Version}}'
          docker buildx version || true
          git --version
          node --version
          go version || echo "(作业容器无 go，构建都在 golang 容器里跑)"

      - name: 检出代码（裸 git，不走 action）
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          git init -q .
          TOKEN="${{ secrets.RELEASE_TOKEN }}"
          # 仓库是公开的 → 匿名 fetch 就能拉；token 只是转私有后的兜底。
          ok=0
          LAST_ERR=""
          # 作业容器是 host 网络（act_runner container.network=host），所以
          # 127.0.0.1:3000 就是宿主上的 gitea；另外两个只是兜底。
          for base in "http://127.0.0.1:3000" "${GITHUB_SERVER_URL}" "http://gitea:3000"; do
            [ -n "$base" ] || continue
            url="${base}/${GITHUB_REPOSITORY}.git"
            if [ -n "$TOKEN" ]; then
              # token 只出现在变量与 base64 后的 auth 头里，不落盘、不回显
              if LAST_ERR=$(git -c "http.extraheader=AUTHORIZATION: basic $(printf '%s' "${REPO_OWNER}:${TOKEN}" | base64 -w0)" \
                   fetch --depth=1 "$url" "+refs/tags/${TAG}:refs/tags/release" 2>&1); then
                echo "带 token 检出成功（$base）"; ok=1; break
              fi
              echo "-- 带 token 失败（$base）：$(echo "$LAST_ERR" | tail -2 | tr '\n' ' ')"
            fi
            if LAST_ERR=$(git fetch --depth=1 "$url" "+refs/tags/${TAG}:refs/tags/release" 2>&1); then
              echo "匿名检出成功（$base）"; ok=1; break
            fi
            echo "-- 匿名失败（$base）：$(echo "$LAST_ERR" | tail -2 | tr '\n' ' ')"
          done
          [ "$ok" = 1 ] || { echo "::error::拉取 tag ${TAG} 失败（网络或权限）"; exit 1; }
          git checkout -q refs/tags/release
          echo "HEAD = $(git rev-parse --short HEAD)"
          ls

      - name: 版本号一致性
        run: python3 scripts/check_version.py

      - name: 构建前端（node 容器）
        run: |
          set -e
          docker run --rm -v "$PWD":/src -w /src/web \
            -e NPM_REGISTRY="$NPM_REGISTRY" \
            node:22-bookworm sh -c '
              set -e
              npm config set registry "$NPM_REGISTRY"
              npm ci --no-audit --no-fund
              npm run build
            '
          rm -rf web/embed_dir && cp -a web/dist web/embed_dir
          echo "前端产物："
          ls -l web/embed_dir/assets | head

      - name: 构建多平台二进制与发布包
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          docker run --rm -v "$PWD":/src -w /src \
            -e VERSION="$VERSION" -e GOPROXY="$GOPROXY" \
            golang:1.25 sh -c '
              set -e
              go mod download
              ./scripts/build-release.sh "$VERSION"
            '
          echo "----- 产物 -----"
          ls -lh dist-release/

      - name: 构建并推送多架构镜像
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          TOKEN="${{ secrets.RELEASE_TOKEN }}"
          [ -n "$TOKEN" ] || { echo "::error::缺少仓库 secret RELEASE_TOKEN"; exit 1; }

          # 不调 docker login：作业容器里的 127.0.0.1 是它自己，登录不上去；
          # 这里直接把凭证写进 client 的 config.json，buildx 会把它带给 buildkit。
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$IMAGE_REPO" \
            "$(printf '%s' "${REPO_OWNER}:${TOKEN}" | base64 -w0)" | sed 's/[[:space:]]*$//' \
            > "$HOME/.docker/config.json"
          chmod 600 "$HOME/.docker/config.json"

          # docker-container driver + network=host：多架构必需（dockerd 的 docker
          # driver 不支持 manifest list），host 网络才能解析 127.0.0.1:3000。
          # buildkitd.toml 让 buildkit 的 docker.io 走国内镜像源（直连会 EOF）。
          docker buildx rm gitea-builder >/dev/null 2>&1 || true
          docker buildx create --name gitea-builder \
            --driver docker-container \
            --driver-opt network=host \
            --buildkitd-config scripts/buildkitd.toml
          docker buildx use gitea-builder

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.multi \
            --build-arg "GOPROXY=${GOPROXY}" \
            --build-arg "NPM_REGISTRY=${NPM_REGISTRY}" \
            -t "${IMAGE_REPO}:${VERSION}" \
            -t "${IMAGE_REPO}:latest" \
            --push .

          echo "镜像已推送：${IMAGE_REPO}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE_REPO}:${VERSION}" | head -20

      - name: 创建 Release 并上传发布包
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          GITEA_TOKEN="${{ secrets.RELEASE_TOKEN }}" \
          GITEA_API="$GITEA_API" \
          GITEA_REPO="${REPO_OWNER}/${REPO_NAME}" \
          IMAGE_HINT="$IMAGE_HINT" \
            sh scripts/ci-make-release.sh "$VERSION" dist-release

      - name: 汇总
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          {
            echo "## 发布完成 ${VERSION}"
            echo ""
            echo "**镜像（linux/amd64 + linux/arm64）**"
            echo '```'
            echo "docker pull ${IMAGE_HINT}:${VERSION}"
            echo '```'
            echo "**发布包**"
            ls -lh dist-release/ | sed 's/^/    /'
            echo ""
            echo "**Release** → ${GITHUB_SERVER_URL}/${REPO_OWNER}/${REPO_NAME}/releases/tag/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
