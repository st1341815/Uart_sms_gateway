name: Release (Gitea)

# 本地 Gitea 的发版流水线。
#
# 触发：推送 v* tag（同时会触发一次 push，日常 CI 见 ci.yml）
# 产出：
#   1) 多架构镜像 →  Gitea 内置容器仓库 <gitea>/<owner>/<repo>:<tag> 与 :latest
#   2) 多平台二进制 → 发布包 uart_sms_forwarder-<tag>-<platform>.tar.gz / .exe.zip
#   3) Gitea Release（tag）并挂上发布包
#
# ⚠️ 刻意不用 actions/checkout / setup-go / setup-node：
#   act_runner 是「作业容器 + 宿主 dockerd」模式（无 DinD），拉 GitHub 上的
#   action 要经过 Gitea 的 actions 代理，本机网络下反复 i/o timeout；
#   setup-go / setup-node 还要从 action 缓存里下 toolchain。
#   改为：git clone（token 内嵌 URL）+ 直接用 golang / node 官方镜像跑步骤。
#   纯 shell，无第三方 action，稳定且快。

on:
  push:
    tags:
      - 'v*'

env:
  # act_runner 把 /var/run/docker.sock 挂进作业容器，所以 docker CLI 直接可用
  DOCKER_HOST: unix:///var/run/docker.sock
  GOPROXY: https://goproxy.cn,direct
  NPM_REGISTRY: https://registry.npmmirror.com
  # 镜像仓库地址 = Gitea 自己的内置 registry
  IMAGE_REPO: ${{ gitea.server_url }}/${{ gitea.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 环境检查
        run: |
          set -e
          echo "tag      = ${GITHUB_REF#refs/tags/}"
          echo "repo     = ${GITHUB_REPOSITORY}"
          echo "server   = ${GITHUB_SERVER_URL}"
          echo "image    = ${IMAGE_REPO}"
          echo "workspace= $PWD"
          docker version --format '  docker {{.Server.Version}}'
          docker buildx version || true
          git --version
          node --version
          go version || echo "(宿主机无 go，后面都在容器里跑)"

      - name: 检出代码（裸 git，不走 action）
        run: |
          set -e
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          TOKEN="${GITHUB_TOKEN:-${{ secrets.GITEA_TOKEN }}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::没有可用的仓库 token，无法 clone"
            exit 1
          fi
          # token 只存在变量与 URL 里，不落盘、不回显
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
              fetch --depth=1 origin "+refs/tags/${GITHUB_REF#refs/tags/}:refs/tags/release"
          git checkout -q refs/tags/release
          echo "HEAD = $(git rev-parse --short HEAD)"
          ls

      - name: 版本号一致性
        run: python3 scripts/check_version.py

      - name: 构建前端（node 容器）
        run: |
          set -e
          docker run --rm -v "$PWD":/src -w /src/web \
            -e NPM_REGISTRY="$NPM_REGISTRY" \
            node:22-bookworm sh -c '
              set -e
              npm config set registry "$NPM_REGISTRY"
              npm ci --no-audit --no-fund
              npm run build
            '
          rm -rf web/embed_dir && cp -a web/dist web/embed_dir
          echo "前端产物："
          ls -l web/embed_dir/assets | head

      - name: 构建多平台二进制与发布包
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          docker run --rm -v "$PWD":/src -w /src \
            -e VERSION="$VERSION" -e GOPROXY="$GOPROXY" \
            golang:1.25 sh -c '
              set -e
              go mod download
              ./scripts/build-release.sh "$VERSION"
            '
          echo "----- 产物 -----"
          ls -lh dist-release/

      - name: 构建并推送多架构镜像
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "${{ secrets.GITEA_TOKEN }}" | \
            docker login "${GITHUB_SERVER_URL#http://}" -u "${GITHUB_REPOSITORY%%/*}" --password-stdin
          docker buildx create --name relbuilder --use --driver docker-container 2>/dev/null || docker buildx use relbuilder
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.multi \
            --build-arg "GOPROXY=${GOPROXY}" \
            --build-arg "NPM_REGISTRY=${NPM_REGISTRY}" \
            -t "${IMAGE_REPO}:${VERSION}" \
            -t "${IMAGE_REPO}:latest" \
            --push .
          echo "镜像已推送：${IMAGE_REPO}:${VERSION}"

      - name: 创建 Release 并上传发布包
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p .release-bin && cp dist-release/* .release-bin/
          sh scripts/release-gitea.sh "$VERSION" .release-bin

      - name: 汇总
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          {
            echo "## 发布完成 $VERSION"
            echo ""
            echo "**镜像（amd64 + arm64）**"
            echo '```'
            echo "docker pull ${IMAGE_REPO}:${VERSION}"
            echo '```'
            echo "**发布包**"
            ls -lh dist-release/ | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
